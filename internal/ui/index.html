<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>通用提供商</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f7;
      --surface: #ffffff;
      --surface-2: #f0f2f3;
      --text: #171a1d;
      --muted: #626970;
      --line: #d8dcdf;
      --accent: #176b4d;
      --accent-strong: #0f573d;
      --accent-soft: #e3f2eb;
      --danger: #b3261e;
      --danger-soft: #fce8e6;
      --warn: #8a5600;
      --shadow: 0 8px 30px rgba(23, 26, 29, .12);
      --radius: 6px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191b;
        --surface: #212427;
        --surface-2: #292d30;
        --text: #f1f3f4;
        --muted: #adb3b8;
        --line: #3b4145;
        --accent: #58b98d;
        --accent-strong: #79c9a5;
        --accent-soft: #193c2e;
        --danger: #ff8a80;
        --danger-soft: #4a2220;
        --warn: #f0b95d;
        --shadow: 0 10px 36px rgba(0, 0, 0, .35);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { min-width: 280px; }
    button, input, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .shell { width: min(1180px, 100%); margin: 0 auto; padding: 22px 26px 56px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 46px; margin-bottom: 22px; }
    .brand { min-width: 0; display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; color: #fff; background: var(--accent); border-radius: 6px; font-weight: 750; font-size: 13px; }
    h1 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700; }
    .subtitle { margin-top: 2px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions { display: flex; align-items: center; gap: 8px; flex: none; }
    .btn { min-height: 36px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 7px 13px; font-weight: 620; }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { border-color: var(--accent); color: #fff; background: var(--accent); }
    .btn.primary:hover { background: var(--accent-strong); }
    .btn.danger { color: var(--danger); }
    .btn.icon { width: 36px; padding: 0; font-size: 20px; line-height: 1; }
    .btn.small { min-height: 30px; padding: 4px 10px; font-size: 12px; }
    .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
    .dot.ready { background: var(--accent); }
    .section { padding: 22px 0 26px; border-top: 1px solid var(--line); }
    .section:first-of-type { border-top: 0; padding-top: 4px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
    .section-title { margin: 0; font-size: 15px; line-height: 1.3; font-weight: 700; }
    .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px 16px; }
    .field { grid-column: span 4; min-width: 0; }
    .field.wide { grid-column: span 8; }
    .field.full { grid-column: 1 / -1; }
    .field.half { grid-column: span 6; }
    label, .label { display: block; margin: 0 0 6px; color: var(--muted); font-size: 12px; font-weight: 620; }
    input, select { width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 8px 10px; outline: 0; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent); }
    input::placeholder { color: color-mix(in srgb, var(--muted) 72%, transparent); }
    .protocols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .protocols label { margin: 0; min-width: 0; }
    .protocols input { position: absolute; width: 1px; min-height: 0; height: 1px; margin: 0; padding: 0; opacity: 0; pointer-events: none; }
    .protocols span { min-height: 42px; display: grid; place-items: center; padding: 8px 10px; border-left: 1px solid var(--line); background: var(--surface); color: var(--muted); text-align: center; font-size: 12px; font-weight: 650; }
    .protocols label:first-child span { border-left: 0; }
    .protocols input:checked + span { background: var(--accent-soft); color: var(--accent-strong); box-shadow: inset 0 -2px 0 var(--accent); }
    .protocols input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
    .toggles { display: flex; flex-wrap: wrap; gap: 18px; min-height: 38px; align-items: center; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; margin: 0; color: var(--text); font-size: 13px; cursor: pointer; }
    .toggle input { width: 36px; min-height: 20px; height: 20px; padding: 0; appearance: none; border-radius: 10px; background: var(--line); position: relative; }
    .toggle input::after { content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: transform .15s ease; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .toggle input:checked { background: var(--accent); }
    .toggle input:checked::after { transform: translateX(16px); }
    .rows { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .row { display: grid; grid-template-columns: minmax(140px, .8fr) minmax(220px, 1.4fr) 36px; gap: 10px; align-items: end; }
    .item { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 15px; }
    .item-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .item-name { min-width: 0; font-weight: 690; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-actions { display: flex; gap: 6px; flex: none; }
    .key-grid { display: grid; grid-template-columns: 1fr 1.5fr 1fr 120px; gap: 12px; }
    .key-grid > .field, .model-main > .field, .model-detail > .field { grid-column: auto; }
    .secret-wrap { display: flex; gap: 6px; }
    .secret-wrap input { min-width: 0; }
    .secret-wrap button { flex: none; }
    .model-main { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 12px; }
    .model-detail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding-top: 13px; margin-top: 13px; border-top: 1px solid var(--line); }
    .model-detail[hidden] { display: none; }
    .model-detail .span-2 { grid-column: span 2; }
    .model-detail .span-4 { grid-column: 1 / -1; }
    .section-actions { display: flex; align-items: center; gap: 8px; }
    .discovery { margin: 0 0 14px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .discovery[hidden] { display: none; }
    .discovery-toolbar { display: grid; grid-template-columns: minmax(180px, 1fr) auto auto auto; gap: 8px; align-items: center; margin-bottom: 10px; }
    .discovery-check { display: inline-flex; align-items: center; gap: 7px; margin: 0; color: var(--text); font-size: 12px; white-space: nowrap; }
    .discovery-check input { width: 16px; min-height: 16px; height: 16px; padding: 0; }
    .discovery-list { max-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .discovery-option { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 9px; align-items: start; margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); color: var(--text); font-size: 13px; }
    .discovery-option:first-child { border-top: 0; }
    .discovery-option input { width: 16px; min-height: 16px; height: 16px; margin-top: 1px; padding: 0; }
    .discovery-name { min-width: 0; overflow-wrap: anywhere; }
    .discovery-display { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .empty { padding: 28px 16px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; }
    .auth-modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(10, 12, 14, .56); }
    .auth-modal[hidden] { display: none; }
    .dialog { width: min(420px, 100%); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); padding: 22px; }
    .dialog h2 { margin: 0 0 18px; font-size: 17px; }
    .dialog-actions { display: flex; justify-content: flex-end; margin-top: 14px; }
    .notice { position: fixed; right: 20px; bottom: 20px; z-index: 70; width: max-content; max-width: min(360px, calc(100% - 40px)); padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); pointer-events: none; }
    .notice[hidden] { display: none; }
    .notice.error { border-color: var(--danger); color: var(--danger); }
    .notice.success { border-color: var(--accent); color: var(--accent-strong); }
    .testbar { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(160px, 1fr) auto; gap: 10px; align-items: end; }
    .test-result { min-height: 20px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .test-result.ok { color: var(--accent-strong); }
    .test-result.fail { color: var(--danger); }
    .loading { opacity: .62; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 820px) {
      .shell { padding: 18px 18px 48px; }
      .field, .field.wide { grid-column: span 6; }
      .field.full { grid-column: 1 / -1; }
      .key-grid { grid-template-columns: 1fr 1fr; }
      .model-detail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .model-detail .span-4 { grid-column: 1 / -1; }
      .model-main { grid-template-columns: 1fr 1fr; }
      .model-main .field:last-child { grid-column: 1 / -1; }
      .discovery-toolbar { grid-template-columns: minmax(180px, 1fr) auto auto; }
      .discovery-toolbar .discovery-check { grid-column: 1 / -1; grid-row: 2; }
    }
    @media (max-width: 560px) {
      .shell { padding: 14px 12px 40px; }
      .topbar { align-items: flex-start; }
      .subtitle, .status { display: none; }
      .actions .btn:not(.primary) { padding-inline: 9px; }
      .protocols { grid-template-columns: 1fr 1fr; }
      .protocols label:nth-child(3) span { border-left: 0; border-top: 1px solid var(--line); }
      .protocols label:nth-child(4) span { border-top: 1px solid var(--line); }
      .field, .field.wide, .field.half { grid-column: 1 / -1; }
      .key-grid, .model-main, .model-detail, .testbar { grid-template-columns: 1fr; }
      .model-detail .span-2, .model-detail .span-4 { grid-column: 1; }
      .row { grid-template-columns: 1fr 1fr 36px; }
      .section-head { align-items: flex-start; }
      .section-actions { flex-wrap: wrap; justify-content: flex-end; }
      .discovery-toolbar { grid-template-columns: 1fr 1fr; }
      .discovery-toolbar input[type="search"] { grid-column: 1 / -1; }
      .discovery-toolbar .discovery-check { grid-column: 1 / -1; grid-row: auto; }
      .section { padding-block: 19px 22px; }
      .notice { right: 12px; bottom: 12px; max-width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <main class="shell" id="app" aria-busy="true">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">MP</div>
        <div><h1 id="page-title">通用提供商</h1><div class="subtitle">Multi-protocol Provider</div></div>
      </div>
      <div class="actions">
        <span class="status"><span class="dot" id="status-dot"></span><span id="status-text">未连接</span></span>
        <button class="btn" id="auth-button" type="button">管理密钥</button>
        <button class="btn primary" id="save-button" type="button">保存</button>
      </div>
    </header>

    <form id="provider-form" autocomplete="off">
      <section class="section">
        <div class="section-head"><h2 class="section-title">连接</h2></div>
        <div class="grid">
          <div class="field full">
            <span class="label">协议</span>
            <div class="protocols" role="radiogroup" aria-label="协议">
              <label><input type="radio" name="protocol" value="openai-chat-completions"><span>OpenAI Chat Completions</span></label>
              <label><input type="radio" name="protocol" value="openai-responses"><span>OpenAI Responses</span></label>
              <label><input type="radio" name="protocol" value="anthropic-messages"><span>Anthropic Messages</span></label>
              <label><input type="radio" name="protocol" value="gemini"><span>Gemini</span></label>
            </div>
          </div>
          <div class="field"><label for="provider-name">名称</label><input id="provider-name" name="name" required maxlength="100"></div>
          <div class="field wide"><label for="base-url">Base URL</label><input id="base-url" name="base-url" type="url" required placeholder="https://api.example.com/v1"></div>
          <div class="field"><label for="prefix">模型前缀</label><input id="prefix" name="prefix" placeholder="team"></div>
          <div class="field"><label for="provider-priority">提供商优先级</label><input id="provider-priority" name="priority" type="number" min="-1000000" max="1000000" step="1" value="0"></div>
          <div class="field"><label for="test-model">测试模型</label><input id="test-model" name="test-model"></div>
          <div class="field wide">
            <span class="label">状态</span>
            <div class="toggles">
              <label class="toggle"><input id="provider-disabled" type="checkbox"><span>停用提供商</span></label>
              <label class="toggle"><input id="disable-cooling" type="checkbox"><span>关闭 Key 冷却</span></label>
            </div>
          </div>
          <div class="field full">
            <div class="section-head"><span class="label">自定义请求头</span><button class="btn small" id="add-header" type="button">+ 添加</button></div>
            <div class="rows" id="headers-list"></div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div><h2 class="section-title">API Keys</h2><span class="count" id="keys-count">0</span></div>
          <button class="btn small" id="add-key" type="button">+ 添加 Key</button>
        </div>
        <div class="rows" id="keys-list"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <div><h2 class="section-title">模型</h2><span class="count" id="models-count">0</span></div>
          <div class="section-actions">
            <button class="btn small" id="discover-models" type="button">获取模型</button>
            <button class="btn small" id="add-model" type="button">+ 添加模型</button>
          </div>
        </div>
        <div class="discovery" id="model-discovery" hidden>
          <div class="discovery-toolbar">
            <input id="discovery-search" type="search" placeholder="筛选模型" aria-label="筛选已发现模型">
            <label class="discovery-check"><input id="discovery-select-all" type="checkbox"><span>全选</span></label>
            <button class="btn small primary" id="import-models" type="button">导入所选</button>
            <button class="btn small" id="close-discovery" type="button">关闭</button>
          </div>
          <div class="discovery-list" id="discovered-models"></div>
        </div>
        <div class="rows" id="models-list"></div>
      </section>

      <section class="section">
        <div class="section-head"><h2 class="section-title">连接测试</h2></div>
        <div class="testbar">
          <div><label for="test-key">API Key</label><select id="test-key"></select></div>
          <div><label for="test-model-select">模型</label><select id="test-model-select"></select></div>
          <button class="btn" id="test-button" type="button">测试连接</button>
        </div>
        <div class="test-result" id="test-result" role="status"></div>
      </section>
    </form>
  </main>

  <div class="auth-modal" id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title" hidden>
    <form class="dialog" id="auth-form">
      <h2 id="auth-title">管理密钥</h2>
      <label for="management-key">Management Key</label>
      <input id="management-key" type="password" autocomplete="current-password" required>
      <div class="dialog-actions"><button class="btn primary" type="submit">连接</button></div>
    </form>
  </div>
  <div class="notice" id="notice" role="status" hidden></div>

  <script>
  (() => {
    'use strict';
    const PLUGIN_ID = 'multi-protocol-provider';
    const MANAGEMENT = '/v0/management';
    const API = `${MANAGEMENT}/plugins/${PLUGIN_ID}`;
    const AUTH_MESSAGE = 'cpa-management-auth';
    const READY_MESSAGE = 'cpa-multi-protocol-provider-ready';
    const parentOrigin = new URLSearchParams(window.location.search).get('parent-origin') || '';
    const state = {
      config: null,
      credentialDestination: null,
      keys: [],
      discoveredModels: [],
      baseline: '',
      dirty: false,
      noticeTimer: 0,
      busy: false
    };
    let managementToken = '';
    let authFallbackTimer = 0;
    let authReadyTimer = 0;
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const app = $('#app');
    const form = $('#provider-form');
    const authModal = $('#auth-modal');
    const managementKey = $('#management-key');

    function getToken() { return managementToken; }
    function setToken(value) { managementToken = String(value || ''); }
    function clearAuthTimers() {
      clearTimeout(authFallbackTimer);
      clearInterval(authReadyTimer);
      authFallbackTimer = 0;
      authReadyTimer = 0;
    }
    function showAuth() {
      clearAuthTimers();
      authModal.hidden = false;
      managementKey.value = '';
      setTimeout(() => managementKey.focus(), 0);
    }
    function hideAuth() { authModal.hidden = true; }
    function requestParentAuth() {
      if (!parentOrigin || window.parent === window) return false;
      try {
        const announceReady = () => window.parent.postMessage({ type: READY_MESSAGE }, parentOrigin);
        announceReady();
        authReadyTimer = setInterval(announceReady, 250);
        authFallbackTimer = setTimeout(() => {
          clearAuthTimers();
          if (!getToken()) showAuth();
        }, 1500);
        return true;
      } catch (_) {
        return false;
      }
    }
    function notify(message, kind = '') {
      const el = $('#notice');
      clearTimeout(state.noticeTimer);
      el.textContent = message;
      el.className = `notice ${kind}`;
      el.hidden = false;
      state.noticeTimer = setTimeout(() => { el.hidden = true; }, 4200);
    }
    function setBusy(value) {
      state.busy = value;
      app.classList.toggle('loading', value);
      app.setAttribute('aria-busy', String(value));
      $('#save-button').disabled = value;
      $('#test-button').disabled = value;
      $('#discover-models').disabled = value;
      updateDiscoveryControls();
    }
    function setConnected(value) {
      $('#status-dot').classList.toggle('ready', value);
      $('#status-text').textContent = value ? '已连接' : '未连接';
    }
    async function request(path, options = {}) {
      const token = getToken();
      if (!token) { showAuth(); throw new Error('需要管理密钥'); }
      const headers = new Headers(options.headers || {});
      headers.set('Authorization', `Bearer ${token}`);
      if (options.body && !headers.has('Content-Type')) headers.set('Content-Type', 'application/json');
      const response = await fetch(path, { ...options, headers, cache: 'no-store' });
      let body = null;
      const text = await response.text();
      if (text) { try { body = JSON.parse(text); } catch (_) { body = { message: text }; } }
      if (!response.ok) {
        if (response.status === 401) { setToken(''); setConnected(false); showAuth(); }
        throw new Error(body?.message || body?.error || `HTTP ${response.status}`);
      }
      return body;
    }
    const escapeText = (value) => String(value ?? '');
    function element(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key === 'class') node.className = value;
        else if (key === 'text') node.textContent = escapeText(value);
        else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
        else if (value === true) node.setAttribute(key, '');
        else if (value !== false && value != null) node.setAttribute(key, String(value));
      }
      for (const child of children) node.append(child);
      return node;
    }
    function field(labelText, input) {
      const label = element('label', { text: labelText });
      label.append(input);
      return label;
    }
    function textInput(value = '', attrs = {}) {
      const input = element('input', attrs);
      input.value = value ?? '';
      return input;
    }
    function checkbox(value, labelText) {
      const input = element('input', { type: 'checkbox' });
      input.checked = Boolean(value);
      return element('label', { class: 'toggle' }, [input, element('span', { text: labelText })]);
    }
    function empty(text) { return element('div', { class: 'empty', text }); }

    function renderHeaders(headers = {}) {
      const list = $('#headers-list');
      list.replaceChildren();
      for (const [name, value] of Object.entries(headers)) addHeaderRow(name, value);
      if (!list.children.length) list.append(empty('暂无自定义请求头'));
    }
    function addHeaderRow(name = '', value = '') {
      const list = $('#headers-list');
      $('.empty', list)?.remove();
      const nameInput = textInput(name, { placeholder: 'Header-Name', 'aria-label': '请求头名称' });
      const valueInput = textInput(value, { placeholder: 'Value', 'aria-label': '请求头值' });
      const remove = element('button', { class: 'btn icon danger', type: 'button', title: '删除请求头', 'aria-label': '删除请求头', text: '×' });
      const row = element('div', { class: 'row' }, [field('名称', nameInput), field('值', valueInput), remove]);
      remove.addEventListener('click', () => { row.remove(); if (!list.children.length) list.append(empty('暂无自定义请求头')); updateDirty(); });
      list.append(row);
    }

    function newID(prefix) {
      if (globalThis.crypto?.randomUUID) return `${prefix}-${crypto.randomUUID()}`;
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function normalizedList(values = []) {

    }
    function canonicalConfig(value = {}) {
      const headers = Object.entries(value.headers || {})
        .map(([name, headerValue]) => [String(name).trim(), String(headerValue).trim()])
        .filter(([name]) => name)

          name: String(model.name || '').trim(),
          alias: String(model.alias || '').trim(),
          'display-name': String(model['display-name'] || '').trim(),
          'force-mapping': Boolean(model['force-mapping']),
          image: Boolean(model.image),
          'input-modalities': normalizedList(model['input-modalities'] || []),
          'output-modalities': normalizedList(model['output-modalities'] || []),

    function stripTestThinkingSuffix(value) {
      const match = String(value || '').trim().match(/^(.*)\(([^()]*)\)$/);
      if (!match) return String(value || '').trim();
      const suffix = match[2].toLowerCase();
      const named = ['none', 'auto', '-1', 'minimal', 'low', 'medium', 'high', 'xhigh', 'max'];
      const numeric = /^[+-]?\d+$/.test(suffix) && Number(suffix) >= 0;
      if (!named.includes(suffix) && !numeric) return String(value || '').trim();
      return match[1].trim();
    }
    function modelIDsForTest(item) {
      const inputs = $$('.model-main input', item);

    function updateCountsAndTestOptions() {

      $('#keys-count').textContent = `${keyItems.length} 个 Key`;
      $('#models-count').textContent = `${modelItems.length} 个模型`;

      if ([...modelSelect.options].some((o) => o.value === previousModel)) modelSelect.value = previousModel;

    function validate(config, keys, requireAllCredentialReentry = true) {
      if (!form.reportValidity()) return false;
      if (!config['base-url']) { notify('Base URL 不能为空', 'error'); return false; }
      try {
        const url = new URL(config['base-url']);
        if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password || url.search || url.hash) throw new Error();
      } catch (_) { notify('Base URL 必须是无认证、无查询参数和片段的 HTTP(S) 地址', 'error'); return false; }
      if (config.models.some((model) => !model.name)) { notify('模型名称不能为空', 'error'); return false; }
      const publicIDs = config.models.map((model) => {
        const base = model.alias || model.name;
        return config.prefix ? [base, `${config.prefix}/${base}`] : [base];
      });
      const seenPublicIDs = new Set();
      if (publicIDs.some((modelIDs) => modelIDs.some((id) => seenPublicIDs.has(id) || !seenPublicIDs.add(id)))) {
        notify('模型 ID 不能重复', 'error'); return false;
      }
      if (publicIDs.some((modelIDs, publicIndex) => modelIDs.some((id) => config.models.some((model, upstreamIndex) => upstreamIndex !== publicIndex && model.name === id)))) {
        notify('公开模型 ID 不能与另一个上游模型名重复', 'error'); return false;
      }
      const savedProtocol = state.config?.protocol || 'openai-chat-completions';
      const savedBaseURL = String(state.config?.['base-url'] || '').trim().replace(/\/+$/, '');
      const nextBaseURL = String(config['base-url'] || '').trim().replace(/\/+$/, '');
      const boundProtocol = state.credentialDestination?.protocol || '';
      const boundBaseURL = String(state.credentialDestination?.['base-url'] || '').trim().replace(/\/+$/, '');
      const destinationChanged = savedProtocol !== config.protocol || savedBaseURL !== nextBaseURL ||
        boundProtocol !== config.protocol || boundBaseURL !== nextBaseURL;
      if (requireAllCredentialReentry && destinationChanged && keys.some((key) => !key['api-key'] || key['preserve-proxy-url'])) {
        notify('切换协议或 Base URL 时，必须重新输入所有 API Key 和带认证信息的代理 URL', 'error');
        return false;
      }
      return true;
    }
    async function load() {
      setBusy(true);

        fillConfig(data.config || {});

    async function waitUntilProviderDisabled() {
      const deadline = Date.now() + 10000;
      let lastError;
      while (Date.now() < deadline) {
        try {
          const data = await request(`${API}/state`);
          if (data.config?.disabled === true) return;
        } catch (error) { lastError = error; }
        await new Promise((resolve) => setTimeout(resolve, 250));
      }
      throw lastError || new Error('等待提供商停用超时');
    }
    async function waitUntilConfigMatches(target) {
      const deadline = Date.now() + 15000;
      let lastError;
      while (Date.now() < deadline) {
        try {
          const data = await request(`${API}/state`);
          if (configsEqual(data.config || {}, target)) return data;
        } catch (error) {
          lastError = error;
          if (!getToken()) throw error;
        }
        await new Promise((resolve) => setTimeout(resolve, 250));
      }
      throw lastError || new Error('等待 CPA 应用最终配置超时');
    }
    async function save() {
      let config = collectConfig(); const keys = collectKeys();
      if (!validate(config, keys)) return;
      setBusy(true);
      let disabledConfirmed = false;
      try {
        const validation = await request(`${API}/validate`, { method: 'POST', body: JSON.stringify({ config }) });
        config = validation.config;
        await request(`${MANAGEMENT}/plugins/${PLUGIN_ID}/config`, { method: 'PATCH', body: JSON.stringify({ disabled: true }) });
        await waitUntilProviderDisabled();
        disabledConfirmed = true;
        await request(`${API}/keys`, {
          method: 'PUT',
          body: JSON.stringify({ keys, destination: { protocol: config.protocol, 'base-url': config['base-url'] } })
        });
        // Stock CPA preserves comments by merging YAML mappings even for PUT.
        // An explicit null is required to clear the last custom header.
        const hostConfig = { ...config, headers: Object.keys(config.headers || {}).length ? config.headers : null };
        await request(`${MANAGEMENT}/plugins/${PLUGIN_ID}/config`, { method: 'PUT', body: JSON.stringify(hostConfig) });
        const applied = await waitUntilConfigMatches(config);
        state.credentialDestination = applied['credential-destination'] || null;
        fillConfig(applied.config || {});
        renderKeys(applied.keys || []);
        markClean();
        notify('配置已保存', 'success');
      } catch (error) {
        if (disabledConfirmed) {
          let currentlyDisabled = true;
          try {
            const current = await request(`${API}/state`);
            currentlyDisabled = Boolean(current.config?.disabled);
            $('#provider-disabled').checked = currentlyDisabled;
          } catch (_) {
            $('#provider-disabled').checked = true;
          }
          updateDirty();
          notify(`保存未完成，提供商当前${currentlyDisabled ? '保持停用' : '已启用'}：${error.message}`, 'error');
        } else {
          notify(error.message, 'error');
        }
      }
      finally { setBusy(false); }
    }
    async function testConnection() {
      const config = collectConfig(); const keys = collectKeys();
      if (!validate(config, keys, false)) return;
      const keyID = $('#test-key').value; const key = keys.find((item) => item.id === keyID);
      const model = $('#test-model-select').value || config['test-model'];
      if (!key || !model) { notify('请选择 Key 和模型', 'error'); return; }
      const output = $('#test-result'); output.className = 'test-result'; output.textContent = '正在测试...';
      setBusy(true);

        output.className = 'test-result ok';

      } catch (error) { output.className = 'test-result fail'; output.textContent = error.message; }
      finally { setBusy(false); }
    }

    $('#add-header').addEventListener('click', () => { addHeaderRow(); updateDirty(); });
    $('#add-key').addEventListener('click', () => { $('.empty', $('#keys-list'))?.remove(); $('#keys-list').append(keyItem({ id: newID('key') })); updateCountsAndTestOptions(); updateDirty(); });
    $('#add-model').addEventListener('click', () => { $('.empty', $('#models-list'))?.remove(); $('#models-list').append(modelItem({})); updateCountsAndTestOptions(); updateDirty(); });
    $('#discover-models').addEventListener('click', discoverModels);
    $('#import-models').addEventListener('click', importSelectedModels);
    $('#close-discovery').addEventListener('click', () => { $('#model-discovery').hidden = true; });
    $('#discovery-search').addEventListener('input', renderDiscoveredModels);
    $('#discovery-select-all').addEventListener('change', (event) => {
      visibleDiscoveredModels().forEach(({ index }) => { state.discoveredModels[index].selected = event.target.checked; });
      renderDiscoveredModels();
    });
    $('#auth-button').addEventListener('click', showAuth);
    $('#save-button').addEventListener('click', save);
    $('#test-button').addEventListener('click', testConnection);
    $('#test-model').addEventListener('input', updateCountsAndTestOptions);
    $('#prefix').addEventListener('input', updateCountsAndTestOptions);
    $('#auth-form').addEventListener('submit', (event) => { event.preventDefault(); const value = managementKey.value.trim(); if (!value) return; setToken(value); managementKey.value = ''; load(); });
    window.addEventListener('message', (event) => {
      if (!parentOrigin || event.source !== window.parent || event.origin !== parentOrigin) return;
      const payload = event.data;
      if (!payload || payload.type !== AUTH_MESSAGE || typeof payload.managementKey !== 'string') return;
      const token = payload.managementKey.trim();
      if (!token) return;
      clearAuthTimers();
      setToken(token);
      hideAuth();
      void load();
    });
    const handleDraftMutation = (event) => { if (!event.target.closest?.('#model-discovery')) updateDirty(); };
    form.addEventListener('input', handleDraftMutation);
    form.addEventListener('change', handleDraftMutation);
    form.addEventListener('submit', (event) => { event.preventDefault(); save(); });
    window.addEventListener('beforeunload', (event) => {
      if (!state.dirty) return;
      event.preventDefault();
      event.returnValue = '';
    });
    setBusy(false);
    if (!requestParentAuth()) showAuth();
  })();
  </script>
</body>
</html>
