name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_ID: multi-protocol-provider

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./... ./.github/scripts ./.github/scripts/stock-e2e
      - run: go vet ./... ./.github/scripts ./.github/scripts/stock-e2e
      - name: Vulnerability scan
        run: |
          set -euo pipefail
          GOTOOLCHAIN=go1.26.5 go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  stock-host:
    name: Test stock CPA v7.2.103 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: router-for-me/CLIProxyAPI
          ref: cade44b9cdee6b9328ea2648fd119129fdf11e2d # v7.2.103
          path: CLIProxyAPI
          fetch-depth: 1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: |
            go.sum
            CLIProxyAPI/go.sum
      - name: Test and build plugin against stock CPA SDK
        run: |
          set -euo pipefail
          go mod edit -replace=github.com/router-for-me/CLIProxyAPI/v7=./CLIProxyAPI
          go test -race ./... ./.github/scripts ./.github/scripts/stock-e2e
          go vet ./... ./.github/scripts ./.github/scripts/stock-e2e
          CGO_ENABLED=1 go build -buildvcs=false -trimpath -buildmode=c-shared \
            -o "${RUNNER_TEMP}/${PLUGIN_ID}.so" "./cmd/${PLUGIN_ID}"
      - name: Test stock host
        working-directory: CLIProxyAPI
        run: |
          set -euo pipefail
          git diff --exit-code
          go test -count=1 ./internal/pluginhost ./internal/thinking ./sdk/cliproxy/auth
          go test -race -count=1 ./internal/pluginhost ./internal/thinking ./sdk/cliproxy/auth
      - name: Build stock host
        working-directory: CLIProxyAPI
        run: |
          set -euo pipefail
          go build -o "${RUNNER_TEMP}/cli-proxy-api" ./cmd/server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go test -c -o "${RUNNER_TEMP}/pluginhost.test.exe" ./internal/pluginhost
      - name: Run stock host plugin smoke test
        run: |
          set -euo pipefail
          go run ./.github/scripts/stock-e2e \
            -host "${RUNNER_TEMP}/cli-proxy-api" \
            -plugin "${RUNNER_TEMP}/${PLUGIN_ID}.so"

  build-linux:
    needs: [test, stock-host]
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    container: debian:bullseye-slim@sha256:cba95a21c96c1f5fc2470081829363eed57706634f7dc26e8c6712934303d57a
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates gcc git libc6-dev
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve names
        run: |
          set -euo pipefail
          VERSION="0.0.0-dev"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
              echo "release tag must be a numeric v-prefixed version such as v0.2.0" >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          {
            echo "VERSION=${VERSION}"
            echo "LIBRARY=${PLUGIN_ID}.${{ matrix.ext }}"
            echo "ARCHIVE=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          } >> "${GITHUB_ENV}"
      - name: Build shared library
        run: |
          set -euo pipefail
          if [[ "$(go env GOVERSION)" != "go1.26.5" ]]; then
            echo "release must use Go 1.26.5" >&2
            exit 1
          fi
          mkdir -p dist
          CGO_ENABLED=1 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -buildvcs=false -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
              -o "dist/${LIBRARY}" "./cmd/${PLUGIN_ID}"
          rm -f "dist/${PLUGIN_ID}.h"
      - name: Scan symbol-preserving audit binary
        run: |
          set -euo pipefail
          GOTOOLCHAIN=go1.26.5 go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          audit_library="${RUNNER_TEMP}/${PLUGIN_ID}-audit.${{ matrix.ext }}"
          CGO_ENABLED=1 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -buildvcs=false -trimpath -buildmode=c-shared \
              -ldflags "-X main.pluginVersion=${VERSION}" \
              -o "${audit_library}" "./cmd/${PLUGIN_ID}"
          rm -f "${RUNNER_TEMP}/${PLUGIN_ID}-audit.h"
          "$(go env GOPATH)/bin/govulncheck" -mode=binary "${audit_library}"
      - name: Verify GLIBC baseline
        run: |
          set -euo pipefail
          highest="$(objdump -T "dist/${LIBRARY}" | sed -nE 's/.*GLIBC_([0-9]+\.[0-9]+).*/\1/p' | sort -V | tail -n 1)"
          if [[ -z "${highest}" ]]; then
            echo "no GLIBC symbol versions found" >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "${highest}" "2.31" | sort -V | tail -n 1)" != "2.31" ]]; then
            echo "highest GLIBC symbol version is ${highest}, expected <= 2.31" >&2
            exit 1
          fi
      - name: Package
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -root . \
            -library "dist/${LIBRARY}" \
            -archive "${ARCHIVE}" \
            -checksum "${ARCHIVE}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  build-native:
    needs: [test, stock-host]
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve names
        run: |
          set -euo pipefail
          VERSION="0.0.0-dev"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
              echo "release tag must be a numeric v-prefixed version such as v0.2.0" >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          {
            echo "VERSION=${VERSION}"
            echo "LIBRARY=${PLUGIN_ID}.${{ matrix.ext }}"
            echo "ARCHIVE=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          } >> "${GITHUB_ENV}"
      - name: Build shared library
        run: |
          set -euo pipefail
          if [[ "$(go env GOVERSION)" != "go1.26.5" ]]; then
            echo "release must use Go 1.26.5" >&2
            exit 1
          fi
          mkdir -p dist
          CGO_ENABLED=1 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -buildvcs=false -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
              -o "dist/${LIBRARY}" "./cmd/${PLUGIN_ID}"
          rm -f "dist/${PLUGIN_ID}.h"
      - name: Package
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -root . \
            -library "dist/${LIBRARY}" \
            -archive "${ARCHIVE}" \
            -checksum "${ARCHIVE}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [stock-host, build-linux, build-native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sort dist/*.sha256 > dist/checksums.txt
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
